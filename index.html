<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Cat Game .IO — All Power-Ups & Abilities</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; max-width: 1000px; max-height: 700px; aspect-ratio: 16 / 9; background: #fff3e0; position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* HUD UI Header */
        #ui-layer { position: absolute; top: 12px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 16px; z-index: 10; pointer-events: none; }
        .hud-panel { display: flex; flex-direction: column; gap: 4px; width: 290px; }
        .score-badge { background: rgba(255, 255, 255, 0.95); padding: 6px 14px; border-radius: 18px; font-weight: bold; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: space-between; }
        .p1-badge { color: #e65100; border: 2px solid #ff9800; }
        .p2-badge { color: #4e342e; border: 2px solid #8d6e63; }
        
        .ability-row { display: flex; gap: 4px; }
        .ability-badge { flex: 1; background: rgba(20, 20, 20, 0.88); color: #fff; padding: 4px 6px; border-radius: 10px; font-size: 0.68rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(4px); }
        .status-tag { font-size: 0.62rem; padding: 1px 4px; border-radius: 4px; background: #2e7d32; color: #fff; margin-top: 2px; }
        .status-tag.cooldown { background: #c62828; }

        .active-powerup-tag { background: rgba(255, 235, 59, 0.9); color: #000; font-weight: bold; font-size: 0.72rem; padding: 3px 8px; border-radius: 10px; text-align: center; display: none; }

        #target-badge { background: #ff6f00; color: #fff; padding: 6px 14px; border-radius: 16px; font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 12px rgba(255,111,0,0.3); }
        #canvas-container { width: 100%; height: 100%; }
        
        #controls-hint { position: absolute; bottom: 8px; width: 100%; display: flex; justify-content: space-between; padding: 0 16px; color: #5d4037; font-weight: bold; font-size: 0.73rem; pointer-events: none; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }

        /* Victory Screen */
        #win-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.82); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #fff; gap: 16px; visibility: hidden; opacity: 0; transition: opacity 0.3s ease; }
        #win-modal.active { visibility: visible; opacity: 1; }
        #win-title { font-size: 2.4rem; font-weight: bold; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #btn-restart { background: #ff9800; color: #fff; border: none; padding: 12px 30px; border-radius: 24px; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 14px rgba(255,152,0,0.4); transition: transform 0.1s ease; }
        #btn-restart:hover { transform: scale(1.05); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <header id="ui-layer">
            <!-- Player 1 HUD -->
            <div class="hud-panel">
                <div class="score-badge p1-badge">🐱 Orange: <span id="p1-score">0</span></div>
                <div class="ability-row">
                    <div class="ability-badge">
                        <span>🐾 Paw [E]</span>
                        <span id="p1-paw-cd" class="status-tag">READY</span>
                    </div>
                    <div class="ability-badge">
                        <span>🦘 Leap [Q]</span>
                        <span id="p1-leap-cd" class="status-tag">READY</span>
                    </div>
                    <div class="ability-badge">
                        <span>🙀 Hiss [F]</span>
                        <span id="p1-hiss-cd" class="status-tag">READY</span>
                    </div>
                </div>
                <div id="p1-powerup-tag" class="active-powerup-tag"></div>
            </div>

            <div id="target-badge">🏁 Race to 100 Mice!</div>

            <!-- Player 2 HUD -->
            <div class="hud-panel">
                <div class="score-badge p2-badge">🐱 Tabby: <span id="p2-score">0</span></div>
                <div class="ability-row">
                    <div class="ability-badge">
                        <span>🐾 Paw [Enter]</span>
                        <span id="p2-paw-cd" class="status-tag">READY</span>
                    </div>
                    <div class="ability-badge">
                        <span>🦘 Leap [R/RShift]</span>
                        <span id="p2-leap-cd" class="status-tag">READY</span>
                    </div>
                    <div class="ability-badge">
                        <span>🙀 Hiss [H]</span>
                        <span id="p2-hiss-cd" class="status-tag">READY</span>
                    </div>
                </div>
                <div id="p2-powerup-tag" class="active-powerup-tag"></div>
            </div>
        </header>

        <div id="canvas-container"></div>

        <div id="controls-hint">
            <span>Orange: Move WASD | Paw: E | Leap: Q | Hiss: F</span>
            <span>Tabby: Move Arrows | Paw: Enter | Leap: R | Hiss: H</span>
        </div>

        <!-- Victory Modal -->
        <div id="win-modal">
            <div id="win-title">🏆 Player Wins!</div>
            <button id="btn-restart" onclick="game.restartGame()">Play Again</button>
        </div>
    </div>

    <script>
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.purrStarted = false;
        }

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            if (!this.purrStarted) {
                this.startPurr();
                this.purrStarted = true;
            }
        }

        startPurr() {
            const now = this.ctx.currentTime;
            const purrOsc = this.ctx.createOscillator();
            const lfo = this.ctx.createOscillator();
            const lfoGain = this.ctx.createGain();
            const purrGain = this.ctx.createGain();

            purrOsc.type = 'sawtooth';
            purrOsc.frequency.setValueAtTime(40, now);

            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(24, now);
            lfoGain.gain.setValueAtTime(15, now);

            lfo.connect(purrOsc.frequency);
            purrGain.gain.setValueAtTime(0.03, now);

            purrOsc.connect(purrGain);
            purrGain.connect(this.ctx.destination);

            purrOsc.start(now);
            lfo.start(now);
        }

        playCuteMeow() {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.linearRampToValueAtTime(850, now + 0.08);
            osc.frequency.exponentialRampToValueAtTime(450, now + 0.28);

            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.28);
        }

        playCryingMeow() {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(650, now);
            osc.frequency.linearRampToValueAtTime(420, now + 0.25);
            osc.frequency.linearRampToValueAtTime(580, now + 0.45);
            osc.frequency.linearRampToValueAtTime(320, now + 0.8);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.8);
        }

        playScratchSound() {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(900, now);
            osc.frequency.linearRampToValueAtTime(200, now + 0.12);

            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.12);
        }

        playHiss() {
            this.init();
            const now = this.ctx.currentTime;
            const bufferSize = this.ctx.sampleRate * 0.3;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 3200;

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(now);
        }

        playLeap() {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(750, now + 0.25);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        }

        playBonk() {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.15);
        }

        playPowerUp() {
            this.init();
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.22);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.22);
        }

        playVictoryFanfare() {
            this.init();
            const now = this.ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                gain.gain.setValueAtTime(0.3, now + idx * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + idx * 0.12);
                osc.stop(now + idx * 0.12 + 0.3);
            });
        }
    }

    class LocalMultiplayerCatGame {
        constructor() {
            this.WIN_TARGET = 100;
            this.p1Score = 0;
            this.p2Score = 0;
            this.isGameOver = false;

            // Stun & Trapped Timers
            this.p1StunnedUntil = 0;
            this.p2StunnedUntil = 0;
            this.p1TrappedInCageUntil = 0;
            this.p2TrappedInCageUntil = 0;

            // Ability Cooldown Timers
            this.p1PawCdUntil = 0;
            this.p2PawCdUntil = 0;
            this.p1LeapCdUntil = 0;
            this.p2LeapCdUntil = 0;
            this.p1HissCdUntil = 0;
            this.p2HissCdUntil = 0;

            // Leap Arc State
            this.p1LeapState = null;
            this.p2LeapState = null;

            // Active Powerup State: { type: 'SHIELD'|'CATNIP'|'MAGNET', expiresAt: number }
            this.p1Powerup = null;
            this.p2Powerup = null;

            this.keyState = {};
            this.mice = [];
            this.powerupsOnGround = [];
            this.tearParticles = [];
            this.shockwaves = [];
            this.audio = new SoundEngine();

            this.initScene();
            this.createArena();
            this.createPlayers();
            this.spawnMice(20);
            this.initInputListeners();

            // Spawn power-ups periodically
            setInterval(() => this.spawnRandomPowerUp(), 6500);

            this.animate();
        }

        initScene() {
            const container = document.getElementById('canvas-container');
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color(0xfff3e0);

            this.camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            this.camera.position.set(0, 24, 20);
            this.camera.lookAt(0, 0, 0);

            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.renderer.setSize(container.clientWidth, container.clientHeight);
            this.renderer.shadowMap.enabled = true;
            container.appendChild(this.renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            this.scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffb74d, 0.85);
            dirLight.position.set(12, 24, 12);
            dirLight.castShadow = true;
            this.scene.add(dirLight);
        }

        createArena() {
            const floorGeo = new THREE.PlaneGeometry(36, 24);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xffecb3, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            this.scene.add(floor);

            const grid = new THREE.GridHelper(36, 18, 0xffb74d, 0xffe082);
            grid.position.y = 0.01;
            this.scene.add(grid);
        }

        createCatMesh(primaryColor, isTabby = false) {
            const catGroup = new THREE.Group();
            const mainMat = new THREE.MeshStandardMaterial({ color: primaryColor, flatShading: true });
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
            const pinkMat = new THREE.MeshStandardMaterial({ color: 0xff80ab, flatShading: true });
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x212121 });
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0x4e342e, flatShading: true });

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.5), mainMat);
            body.position.y = 0.5;
            body.castShadow = true;
            catGroup.add(body);

            // Tabby Stripes
            if (isTabby) {
                for (let zOffset of [-0.4, 0, 0.4]) {
                    const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.82, 0.18), stripeMat);
                    stripe.position.set(0, 0.5, zOffset);
                    catGroup.add(stripe);
                }
            }

            // White Belly
            const belly = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.35, 1.1), whiteMat);
            belly.position.set(0, 0.32, 0);
            catGroup.add(belly);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.75, 0.8), mainMat);
            head.position.set(0, 0.85, -0.8);
            head.castShadow = true;
            catGroup.add(head);

            // Snout & Nose
            const snout = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.25, 0.2), whiteMat);
            snout.position.set(0, 0.72, -1.25);
            const nose = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.05), pinkMat);
            nose.position.set(0, 0.8, -1.36);
            catGroup.add(snout, nose);

            // Eyes
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.05), blackMat);
            eyeL.position.set(-0.25, 0.92, -1.22);
            const eyeR = eyeL.clone();
            eyeR.position.x = 0.25;
            catGroup.add(eyeL, eyeR);

            // Ears
            const earGeo = new THREE.ConeGeometry(0.18, 0.35, 4);
            const earL = new THREE.Mesh(earGeo, mainMat);
            earL.position.set(-0.3, 1.35, -0.8);
            const earR = earL.clone();
            earR.position.x = 0.3;
            catGroup.add(earL, earR);

            // Tail
            const tailGroup = new THREE.Group();
            const tailMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.9, 8), mainMat);
            tailMesh.position.set(0, 0.45, 0);
            tailGroup.add(tailMesh);
            tailGroup.position.set(0, 0.5, 0.75);
            tailGroup.rotation.x = Math.PI / 4;
            catGroup.add(tailGroup);
            catGroup.userData.tail = tailGroup;

            // Super Paw Claws
            const clawGroup = new THREE.Group();
            const clawMat = new THREE.MeshBasicMaterial({ color: 0x00e676 });
            for (let x of [-0.3, -0.1, 0.1, 0.3]) {
                const claw = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.6), clawMat);
                claw.position.set(x, 0.5, -1.4);
                clawGroup.add(claw);
            }
            clawGroup.visible = false;
            catGroup.add(clawGroup);
            catGroup.userData.claws = clawGroup;

            // Bubble Shield Mesh Overlay
            const shieldGeo = new THREE.SphereGeometry(1.3, 16, 16);
            const shieldMat = new THREE.MeshBasicMaterial({ color: 0x29b6f6, transparent: true, opacity: 0.35, wireframe: true });
            const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
            shieldMesh.position.set(0, 0.6, 0);
            shieldMesh.visible = false;
            catGroup.add(shieldMesh);
            catGroup.userData.shield = shieldMesh;

            // Cage Mesh Attachment (3D Metal Cage)
            const cageGroup = new THREE.Group();
            const barMat = new THREE.MeshStandardMaterial({ color: 0x37474f, metalness: 0.8, roughness: 0.2 });
            const topPlate = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 2.0), barMat);
            topPlate.position.y = 1.8;
            cageGroup.add(topPlate);
            const bottomPlate = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 2.0), barMat);
            bottomPlate.position.y = 0.05;
            cageGroup.add(bottomPlate);

            for (let x of [-0.9, -0.3, 0.3, 0.9]) {
                for (let z of [-0.9, 0.9]) {
                    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.7), barMat);
                    bar.position.set(x, 0.9, z);
                    cageGroup.add(bar);
                }
            }
            cageGroup.visible = false;
            catGroup.add(cageGroup);
            catGroup.userData.cage = cageGroup;

            return catGroup;
        }

        createPlayers() {
            // Player 1: Orange Cat
            this.p1Cat = this.createCatMesh(0xff9800, false);
            this.p1Cat.position.set(-6, 0, 0);
            this.scene.add(this.p1Cat);

            // Player 2: Tabby Cat
            this.p2Cat = this.createCatMesh(0x8d6e63, true);
            this.p2Cat.position.set(6, 0, 0);
            this.scene.add(this.p2Cat);
        }

        spawnMice(count) {
            const mouseGeo = new THREE.SphereGeometry(0.26, 6, 6);
            const mouseMat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e, flatShading: true });
            const earMat = new THREE.MeshStandardMaterial({ color: 0xff80ab });

            for (let i = 0; i < count; i++) {
                const mouseGroup = new THREE.Group();
                const body = new THREE.Mesh(mouseGeo, mouseMat);
                body.scale.set(1, 0.8, 1.3);
                body.castShadow = true;
                mouseGroup.add(body);

                const earL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 4, 4), earMat);
                earL.position.set(-0.15, 0.2, -0.15);
                const earR = earL.clone();
                earR.position.x = 0.15;
                mouseGroup.add(earL, earR);

                mouseGroup.position.set((Math.random() - 0.5) * 32, 0.25, (Math.random() - 0.5) * 20);
                mouseGroup.userData = { vx: (Math.random() - 0.5) * 0.08, vz: (Math.random() - 0.5) * 0.08 };

                this.scene.add(mouseGroup);
                this.mice.push(mouseGroup);
            }
        }

        spawnRandomPowerUp() {
            if (this.powerupsOnGround.length >= 4 || this.isGameOver) return;

            const types = ['SHIELD', 'CATNIP', 'MAGNET', 'CAGE', 'TUNA'];
            const chosenType = types[Math.floor(Math.random() * types.length)];

            let color = 0x29b6f6; // Shield Blue
            if (chosenType === 'CATNIP') color = 0x76ff03; // Speed Green
            if (chosenType === 'MAGNET') color = 0xe91e63; // Magnet Pink
            if (chosenType === 'CAGE') color = 0x78909c;   // Cage Gray
            if (chosenType === 'TUNA') color = 0xffd54f;   // Tuna Gold

            const boxGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const boxMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.4, roughness: 0.3 });
            const box = new THREE.Mesh(boxGeo, boxMat);

            box.position.set((Math.random() - 0.5) * 30, 0.4, (Math.random() - 0.5) * 18);
            box.userData = { type: chosenType, rotationSpeed: 0.03 };

            this.scene.add(box);
            this.powerupsOnGround.push(box);
        }

        initInputListeners() {
            window.addEventListener('keydown', (e) => {
                this.audio.init();
                this.keyState[e.code] = true;

                if (this.isGameOver) return;

                // Player 1 Abilities
                if (e.code === 'KeyE') this.useSuperPaw(1);
                if (e.code === 'KeyQ') this.usePounceLeap(1);
                if (e.code === 'KeyF') this.useFrighteningHiss(1);

                // Player 2 Abilities
                if (e.code === 'Enter' || e.code === 'Numpad0') this.useSuperPaw(2);
                if (e.code === 'KeyR' || e.code === 'ShiftRight') this.usePounceLeap(2);
                if (e.code === 'KeyH') this.useFrighteningHiss(2);
            });

            window.addEventListener('keyup', (e) => {
                this.keyState[e.code] = false;
            });

            window.addEventListener('resize', () => {
                const container = document.getElementById('canvas-container');
                this.camera.aspect = container.clientWidth / container.clientHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        // --- ABILITIES & POWER-UPS ---

        useSuperPaw(playerNum) {
            const now = Date.now();
            if (playerNum === 1) {
                if (now < this.p1PawCdUntil || now < this.p1StunnedUntil || now < this.p1TrappedInCageUntil) return;
                this.p1PawCdUntil = now + 4000;
                this.audio.playScratchSound();
                this.p1Cat.userData.claws.visible = true;
                setTimeout(() => { this.p1Cat.userData.claws.visible = false; }, 250);

                if (this.p1Cat.position.distanceTo(this.p2Cat.position) < 2.8) {
                    if (this.p2Powerup && this.p2Powerup.type === 'SHIELD') {
                        this.p2Powerup = null; // Shield absorbs scratch
                    } else {
                        this.p2StunnedUntil = now + 1000;
                        this.p2Cat.position.y = 2.2; // Knock-up!
                    }
                }
            } else {
                if (now < this.p2PawCdUntil || now < this.p2StunnedUntil || now < this.p2TrappedInCageUntil) return;
                this.p2PawCdUntil = now + 4000;
                this.audio.playScratchSound();
                this.p2Cat.userData.claws.visible = true;
                setTimeout(() => { this.p2Cat.userData.claws.visible = false; }, 250);

                if (this.p2Cat.position.distanceTo(this.p1Cat.position) < 2.8) {
                    if (this.p1Powerup && this.p1Powerup.type === 'SHIELD') {
                        this.p1Powerup = null; // Shield absorbs scratch
                    } else {
                        this.p1StunnedUntil = now + 1000;
                        this.p1Cat.position.y = 2.2; // Knock-up!
                    }
                }
            }
        }

        usePounceLeap(playerNum) {
            const now = Date.now();
            if (playerNum === 1) {
                if (now < this.p1LeapCdUntil || now < this.p1StunnedUntil || now < this.p1TrappedInCageUntil) return;
                this.p1LeapCdUntil = now + 5000;
                this.audio.playLeap();
                
                const dirX = -Math.sin(this.p1Cat.rotation.y);
                const dirZ = -Math.cos(this.p1Cat.rotation.y);
                this.p1LeapState = { progress: 0, vx: dirX * 0.45, vz: dirZ * 0.45 };
            } else {
                if (now < this.p2LeapCdUntil || now < this.p2StunnedUntil || now < this.p2TrappedInCageUntil) return;
                this.p2LeapCdUntil = now + 5000;
                this.audio.playLeap();

                const dirX = -Math.sin(this.p2Cat.rotation.y);
                const dirZ = -Math.cos(this.p2Cat.rotation.y);
                this.p2LeapState = { progress: 0, vx: dirX * 0.45, vz: dirZ * 0.45 };
            }
        }

        useFrighteningHiss(playerNum) {
            const now = Date.now();
            if (playerNum === 1) {
                if (now < this.p1HissCdUntil || now < this.p1StunnedUntil || now < this.p1TrappedInCageUntil) return;
                this.p1HissCdUntil = now + 6000;
                this.audio.playHiss();
                this.createShockwave(this.p1Cat.position.clone());

                if (this.p1Cat.position.distanceTo(this.p2Cat.position) < 7.0) {
                    if (this.p2Powerup && this.p2Powerup.type === 'SHIELD') {
                        this.p2Powerup = null;
                    } else {
                        const pushDir = new THREE.Vector3().subVectors(this.p2Cat.position, this.p1Cat.position).normalize();
                        this.p2Cat.position.addScaledVector(pushDir, 3.5);
                        this.p2StunnedUntil = now + 1000;
                    }
                }
            } else {
                if (now < this.p2HissCdUntil || now < this.p2StunnedUntil || now < this.p2TrappedInCageUntil) return;
                this.p2HissCdUntil = now + 6000;
                this.audio.playHiss();
                this.createShockwave(this.p2Cat.position.clone());

                if (this.p2Cat.position.distanceTo(this.p1Cat.position) < 7.0) {
                    if (this.p1Powerup && this.p1Powerup.type === 'SHIELD') {
                        this.p1Powerup = null;
                    } else {
                        const pushDir = new THREE.Vector3().subVectors(this.p1Cat.position, this.p2Cat.position).normalize();
                        this.p1Cat.position.addScaledVector(pushDir, 3.5);
                        this.p1StunnedUntil = now + 1000;
                    }
                }
            }
        }

        createShockwave(pos) {
            const ringGeo = new THREE.RingGeometry(0.2, 0.6, 24);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff1744, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(pos.x, 0.05, pos.z);
            this.scene.add(ring);
            this.shockwaves.push({ mesh: ring, scale: 1, opacity: 0.8 });
        }

        trapTargetInCage(targetNum) {
            const now = Date.now();
            if (targetNum === 2) {
                if (this.p2Powerup && this.p2Powerup.type === 'SHIELD') {
                    this.p2Powerup = null; // Shield blocks cage trap
                    return;
                }
                this.audio.playCryingMeow();
                this.p2TrappedInCageUntil = now + 3500;
                this.p2Cat.userData.cage.visible = true;
            } else {
                if (this.p1Powerup && this.p1Powerup.type === 'SHIELD') {
                    this.p1Powerup = null; // Shield blocks cage trap
                    return;
                }
                this.audio.playCryingMeow();
                this.p1TrappedInCageUntil = now + 3500;
                this.p1Cat.userData.cage.visible = true;
            }
        }

        applyPowerUp(playerNum, type) {
            this.audio.playPowerUp();

            if (type === 'TUNA') {
                if (playerNum === 1) {
                    this.p1Score += 5;
                    document.getElementById('p1-score').innerText = this.p1Score;
                } else {
                    this.p2Score += 5;
                    document.getElementById('p2-score').innerText = this.p2Score;
                }
                return;
            }

            if (type === 'CAGE') {
                this.trapTargetInCage(playerNum === 1 ? 2 : 1);
                return;
            }

            const expiresAt = Date.now() + 6000; // 6 seconds duration for active buffs
            if (playerNum === 1) this.p1Powerup = { type, expiresAt };
            else this.p2Powerup = { type, expiresAt };
        }

        spawnTearParticles(catPos) {
            const tearGeo = new THREE.SphereGeometry(0.08, 6, 6);
            const tearMat = new THREE.MeshBasicMaterial({ color: 0x29b6f6 });

            for (let side of [-0.25, 0.25]) {
                const tear = new THREE.Mesh(tearGeo, tearMat);
                tear.position.set(catPos.x + side, catPos.y + 0.9, catPos.z - 0.8);
                tear.userData = { vy: -0.04, life: 1.0 };
                this.scene.add(tear);
                this.tearParticles.push(tear);
            }
        }

        triggerWin(winnerName, colorCode) {
            this.isGameOver = true;
            this.audio.playVictoryFanfare();
            const modal = document.getElementById('win-modal');
            const title = document.getElementById('win-title');
            title.innerText = `🏆 ${winnerName} Wins!`;
            title.style.color = colorCode;
            modal.classList.add('active');
        }

        restartGame() {
            this.p1Score = 0;
            this.p2Score = 0;
            this.isGameOver = false;
            this.p1StunnedUntil = 0;
            this.p2StunnedUntil = 0;
            this.p1TrappedInCageUntil = 0;
            this.p2TrappedInCageUntil = 0;
            this.p1Powerup = null;
            this.p2Powerup = null;

            document.getElementById('p1-score').innerText = '0';
            document.getElementById('p2-score').innerText = '0';
            document.getElementById('win-modal').classList.remove('active');

            this.p1Cat.position.set(-6, 0, 0);
            this.p1Cat.scale.set(1, 1, 1);
            this.p1Cat.userData.cage.visible = false;

            this.p2Cat.position.set(6, 0, 0);
            this.p2Cat.scale.set(1, 1, 1);
            this.p2Cat.userData.cage.visible = false;
        }

        updateHUD(now) {
            // P1 Ability CDs
            const p1PawElem = document.getElementById('p1-paw-cd');
            p1PawElem.innerText = (now < this.p1PawCdUntil) ? `${((this.p1PawCdUntil - now)/1000).toFixed(1)}s` : 'READY';
            p1PawElem.className = `status-tag ${(now < this.p1PawCdUntil) ? 'cooldown' : ''}`;

            const p1LeapElem = document.getElementById('p1-leap-cd');
            p1LeapElem.innerText = (now < this.p1LeapCdUntil) ? `${((this.p1LeapCdUntil - now)/1000).toFixed(1)}s` : 'READY';
            p1LeapElem.className = `status-tag ${(now < this.p1LeapCdUntil) ? 'cooldown' : ''}`;

            const p1HissElem = document.getElementById('p1-hiss-cd');
            p1HissElem.innerText = (now < this.p1HissCdUntil) ? `${((this.p1HissCdUntil - now)/1000).toFixed(1)}s` : 'READY';
            p1HissElem.className = `status-tag ${(now < this.p1HissCdUntil) ? 'cooldown' : ''}`;

            // P2 Ability CDs
            const p2PawElem = document.getElementById('p2-paw-cd');
            p2PawElem.innerText = (now < this.p2PawCdUntil) ? `${((this.p2PawCdUntil - now)/1000).toFixed(1)}s` : 'READY';
            p2PawElem.className = `status-tag ${(now < this.p2PawCdUntil) ? 'cooldown' : ''}`;

            const p2LeapElem = document.getElementById('p2-leap-cd');
            p2LeapElem.innerText = (now < this.p2LeapCdUntil) ? `${((this.p2LeapCdUntil - now)/1000).toFixed(1)}s` : 'READY';
            p2LeapElem.className = `status-tag ${(now < this.p2LeapCdUntil) ? 'cooldown' : ''}`;

            const p2HissElem = document.getElementById('p2-hiss-cd');
            p2HissElem.innerText = (now < this.p2HissCdUntil) ? `${((this.p2HissCdUntil - now)/1000).toFixed(1)}s` : 'READY';
            p2HissElem.className = `status-tag ${(now < this.p2HissCdUntil) ? 'cooldown' : ''}`;

            // Powerup HUD Badges
            const p1Tag = document.getElementById('p1-powerup-tag');
            if (this.p1Powerup && now < this.p1Powerup.expiresAt) {
                p1Tag.style.display = 'block';
                p1Tag.innerText = `⚡ ${this.p1Powerup.type}`;
            } else {
                p1Tag.style.display = 'none';
                if (this.p1Powerup && this.p1Powerup.type !== 'SHIELD') this.p1Powerup = null;
            }

            const p2Tag = document.getElementById('p2-powerup-tag');
            if (this.p2Powerup && now < this.p2Powerup.expiresAt) {
                p2Tag.style.display = 'block';
                p2Tag.innerText = `⚡ ${this.p2Powerup.type}`;
            } else {
                p2Tag.style.display = 'none';
                if (this.p2Powerup && this.p2Powerup.type !== 'SHIELD') this.p2Powerup = null;
            }

            // Shield Visual Overlays
            this.p1Cat.userData.shield.visible = !!(this.p1Powerup && this.p1Powerup.type === 'SHIELD');
            this.p2Cat.userData.shield.visible = !!(this.p2Powerup && this.p2Powerup.type === 'SHIELD');
        }

        animate() {
            requestAnimationFrame(() => this.animate());

            if (this.isGameOver) {
                this.renderer.render(this.scene, this.camera);
                return;
            }

            const now = Date.now();
            this.updateHUD(now);
            const time = now * 0.005;

            // Catnip Speed Multipliers
            const p1Speed = (this.p1Powerup && this.p1Powerup.type === 'CATNIP') ? 0.28 : 0.17;
            const p2Speed = (this.p2Powerup && this.p2Powerup.type === 'CATNIP') ? 0.28 : 0.17;

            const p1Trapped = now < this.p1TrappedInCageUntil;
            const p2Trapped = now < this.p2TrappedInCageUntil;
            const p1IsStunned = now < this.p1StunnedUntil;
            const p2IsStunned = now < this.p2StunnedUntil;

            // Hide cages if expired
            if (!p1Trapped) this.p1Cat.userData.cage.visible = false;
            if (!p2Trapped) this.p2Cat.userData.cage.visible = false;

            // --- Crying Tears & Cage Shake ---
            if (p1Trapped) {
                this.p1Cat.rotation.z = Math.sin(now * 0.04) * 0.15;
                if (Math.random() < 0.25) this.spawnTearParticles(this.p1Cat.position);
            }
            if (p2Trapped) {
                this.p2Cat.rotation.z = Math.sin(now * 0.04) * 0.15;
                if (Math.random() < 0.25) this.spawnTearParticles(this.p2Cat.position);
            }

            // Animate Tear Particles
            this.tearParticles.forEach((tear, idx) => {
                tear.position.y += tear.userData.vy;
                tear.userData.life -= 0.03;
                if (tear.userData.life <= 0) {
                    this.scene.remove(tear);
                    this.tearParticles.splice(idx, 1);
                }
            });

            // Animate Shockwaves
            this.shockwaves.forEach((sw, idx) => {
                sw.scale += 0.25;
                sw.mesh.scale.set(sw.scale, sw.scale, sw.scale);
                sw.opacity -= 0.03;
                sw.mesh.material.opacity = Math.max(0, sw.opacity);
                if (sw.opacity <= 0) {
                    this.scene.remove(sw.mesh);
                    this.shockwaves.splice(idx, 1);
                }
            });

            // --- Bumping Collisions ---
            const p1Radius = 0.7 * this.p1Cat.scale.x;
            const p2Radius = 0.7 * this.p2Cat.scale.x;
            if (this.p1Cat.position.distanceTo(this.p2Cat.position) < (p1Radius + p2Radius) && !p1IsStunned && !p2IsStunned && !p1Trapped && !p2Trapped) {
                this.audio.playBonk();

                if (!this.p1Powerup || this.p1Powerup.type !== 'SHIELD') this.p1StunnedUntil = now + 1000;
                else this.p1Powerup = null;

                if (!this.p2Powerup || this.p2Powerup.type !== 'SHIELD') this.p2StunnedUntil = now + 1000;
                else this.p2Powerup = null;

                const bumpDir = new THREE.Vector3().subVectors(this.p1Cat.position, this.p2Cat.position).normalize();
                if (bumpDir.lengthSq() === 0) bumpDir.set(1, 0, 0);

                this.p1Cat.position.addScaledVector(bumpDir, 1.0);
                this.p2Cat.position.addScaledVector(bumpDir, -1.0);
            }

            // --- Pounce Leap Movement ---
            if (this.p1LeapState) {
                this.p1LeapState.progress += 0.06;
                this.p1Cat.position.x += this.p1LeapState.vx;
                this.p1Cat.position.z += this.p1LeapState.vz;
                this.p1Cat.position.y = Math.sin(this.p1LeapState.progress * Math.PI) * 2.5;

                if (this.p1LeapState.progress >= 1.0) {
                    this.p1Cat.position.y = 0;
                    this.p1LeapState = null;
                }
            }

            if (this.p2LeapState) {
                this.p2LeapState.progress += 0.06;
                this.p2Cat.position.x += this.p2LeapState.vx;
                this.p2Cat.position.z += this.p2LeapState.vz;
                this.p2Cat.position.y = Math.sin(this.p2LeapState.progress * Math.PI) * 2.5;

                if (this.p2LeapState.progress >= 1.0) {
                    this.p2Cat.position.y = 0;
                    this.p2LeapState = null;
                }
            }

            // --- Player 1 Movement & Stun Handling ---
            if (p1IsStunned) {
                this.p1Cat.rotation.y += 0.35;
                if (this.p1Cat.position.y > 0) this.p1Cat.position.y = Math.max(0, this.p1Cat.position.y - 0.08);
            } else if (!p1Trapped && !this.p1LeapState) {
                this.p1Cat.position.y = 0;
                this.p1Cat.rotation.z = 0;
                let p1X = 0, p1Z = 0;
                if (this.keyState['KeyW']) p1Z -= 1;
                if (this.keyState['KeyS']) p1Z += 1;
                if (this.keyState['KeyA']) p1X -= 1;
                if (this.keyState['KeyD']) p1X += 1;

                if (p1X !== 0 || p1Z !== 0) {
                    this.p1Cat.position.x += p1X * p1Speed;
                    this.p1Cat.position.z += p1Z * p1Speed;
                    this.p1Cat.rotation.y = Math.atan2(p1X, p1Z) + Math.PI;
                    if (this.p1Cat.userData.tail) this.p1Cat.userData.tail.rotation.z = Math.sin(time * 3) * 0.3;
                }
            }
            this.p1Cat.position.x = Math.max(-17, Math.min(17, this.p1Cat.position.x));
            this.p1Cat.position.z = Math.max(-11, Math.min(11, this.p1Cat.position.z));

            // --- Player 2 Movement & Stun Handling ---
            if (p2IsStunned) {
                this.p2Cat.rotation.y += 0.35;
                if (this.p2Cat.position.y > 0) this.p2Cat.position.y = Math.max(0, this.p2Cat.position.y - 0.08);
            } else if (!p2Trapped && !this.p2LeapState) {
                this.p2Cat.position.y = 0;
                this.p2Cat.rotation.z = 0;
                let p2X = 0, p2Z = 0;
                if (this.keyState['ArrowUp']) p2Z -= 1;
                if (this.keyState['ArrowDown']) p2Z += 1;
                if (this.keyState['ArrowLeft']) p2X -= 1;
                if (this.keyState['ArrowRight']) p2X += 1;

                if (p2X !== 0 || p2Z !== 0) {
                    this.p2Cat.position.x += p2X * p2Speed;
                    this.p2Cat.position.z += p2Z * p2Speed;
                    this.p2Cat.rotation.y = Math.atan2(p2X, p2Z) + Math.PI;
                    if (this.p2Cat.userData.tail) this.p2Cat.userData.tail.rotation.z = Math.sin(time * 3) * 0.3;
                }
            }
            this.p2Cat.position.x = Math.max(-17, Math.min(17, this.p2Cat.position.x));
            this.p2Cat.position.z = Math.max(-11, Math.min(11, this.p2Cat.position.z));

            // --- Collecting Ground Power-Ups ---
            this.powerupsOnGround.forEach((box, index) => {
                box.rotation.y += box.userData.rotationSpeed;

                if (this.p1Cat.position.distanceTo(box.position) < 1.2) {
                    this.applyPowerUp(1, box.userData.type);
                    this.scene.remove(box);
                    this.powerupsOnGround.splice(index, 1);
                } else if (this.p2Cat.position.distanceTo(box.position) < 1.2) {
                    this.applyPowerUp(2, box.userData.type);
                    this.scene.remove(box);
                    this.powerupsOnGround.splice(index, 1);
                }
            });

            // --- AI Mice Wandering & Mouse Magnet ---
            this.mice.forEach((mouse) => {
                // Mouse Magnet Power-Up Effect
                if (this.p1Powerup && this.p1Powerup.type === 'MAGNET' && this.p1Cat.position.distanceTo(mouse.position) < 8.0) {
                    mouse.position.lerp(this.p1Cat.position, 0.035);
                } else if (this.p2Powerup && this.p2Powerup.type === 'MAGNET' && this.p2Cat.position.distanceTo(mouse.position) < 8.0) {
                    mouse.position.lerp(this.p2Cat.position, 0.035);
                } else {
                    mouse.position.x += mouse.userData.vx;
                    mouse.position.z += mouse.userData.vz;
                }

                if (Math.abs(mouse.position.x) > 17) mouse.userData.vx *= -1;
                if (Math.abs(mouse.position.z) > 11) mouse.userData.vz *= -1;

                if (Math.random() < 0.02) {
                    mouse.userData.vx = (Math.random() - 0.5) * 0.08;
                    mouse.userData.vz = (Math.random() - 0.5) * 0.08;
                }
                mouse.rotation.y = Math.atan2(mouse.userData.vx, mouse.userData.vz);

                // P1 Catch Mouse
                if (!p1Trapped && !p1IsStunned && this.p1Cat.position.distanceTo(mouse.position) < (0.9 + this.p1Score * 0.005)) {
                    mouse.position.set((Math.random() - 0.5) * 32, 0.25, (Math.random() - 0.5) * 20);
                    this.p1Score += 1;
                    this.p1Cat.scale.addScalar(0.01);
                    document.getElementById('p1-score').innerText = this.p1Score;
                    this.audio.playCuteMeow();

                    if (this.p1Score >= this.WIN_TARGET) {
                        this.triggerWin("Orange Cat (Player 1)", "#ff9800");
                    }
                }

                // P2 Catch Mouse
                if (!p2Trapped && !p2IsStunned && this.p2Cat.position.distanceTo(mouse.position) < (0.9 + this.p2Score * 0.005)) {
                    mouse.position.set((Math.random() - 0.5) * 32, 0.25, (Math.random() - 0.5) * 20);
                    this.p2Score += 1;
                    this.p2Cat.scale.addScalar(0.012);
                    document.getElementById('p2-score').innerText = this.p2Score;
                    this.audio.playCuteMeow();

                    if (this.p2Score >= this.WIN_TARGET) {
                        this.triggerWin("Tabby Cat (Player 2)", "#8d6e63");
                    }
                }
            });

            this.renderer.render(this.scene, this.camera);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        window.game = new LocalMultiplayerCatGame();
    });
    </script>
